# isoshelf on a NAS or home server. See docs/docker.md, which explains
# signing in and the permissions snag that catches people out on TrueNAS.
services:
  isoshelf:
    image: ghcr.io/zachcurry13/isoshelf:latest
    container_name: isoshelf
    restart: unless-stopped
    ports:
      - "8765:8765"
    # Nothing to set up: open the address and isoshelf asks you to choose a
    # username and password. Until somebody does, whoever opens it first is
    # the one who chooses, so do it as soon as it is up.
    #
    # To have them set before it ever starts, uncomment these:
    # environment:
    #   - ISOSHELF_USERNAME=you
    #   - ISOSHELF_PASSWORD=something long and random
    #
    # Until a password is set, isoshelf also prints a link with a secret on
    # the end (docker logs isoshelf); it stops working once there is one. If
    # you forget the password, set the two variables above and restart, or
    # run: docker exec -it isoshelf isoshelf password
    # Anyone who can sign in can add, replace and delete the images in the
    # folder.
    volumes:
      # The folder of images to look after.
      - /mnt/tank/isos:/images
      # isoshelf's own files. Losing this loses settings and history, not
      # images - but there is no reason to lose it.
      - /mnt/tank/appdata/isoshelf:/config
    # The image runs as 1000:1000 by default, but isoshelf works as any user:
    # set this to whoever owns the folders rather than opening them up. On
    # TrueNAS that is usually 568:568.
    user: "1000:1000"
