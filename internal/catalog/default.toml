# The catalog built into isoshelf. The field reference is in CLAUDE.md
# ("Catalog") and internal/catalog/catalog.go. Where each source was found, and
# when it was last checked: docs/catalog-sources.md.
#
# Entries are grouped by what isoshelf can do with them:
#   1. download: update checks plus a place to download from
#   2. check-only: update checks, but no confirmed official checksums yet
#   3. manual: recognized, with a download page link

schema = 1
revision = 20260918 # raise this whenever the catalog changes

