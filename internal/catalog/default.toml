# The catalog built into isoshelf. The field reference is in CLAUDE.md
# ("Catalog") and internal/catalog/catalog.go.
#
# Only netboot.xyz so far. The rest of the sample drive is still to be added,
# using the research in docs/catalog-sources.md.

schema = 1

[[entry]]
id = "netbootxyz"
name = "netboot.xyz"
arch = "x86_64"
match = 'netboot\.xyz\.iso'
fixed_name = true
samples = ["netboot.xyz.iso"]

[entry.source]
type = "github"
repo = "netbootxyz/netboot.xyz"
tag = '(?P<version>\d+\.\d+\.\d+)'
asset = 'netboot\.xyz\.iso'
