[entry.artifact]
# The images are on SourceForge, which sends each download to a mirror. That
# is fine for image bytes, because the checksums come from gparted.org. It
# has to be the /project/ path: the short one serves a web page that says the
# download is starting, which is not an image.
base = "https://downloads.sourceforge.net/project/gparted/gparted-live-stable/{version}/"
file = 'gparted-live-{version}-amd64\.iso'
manifest = "https://gparted.org/gparted-live/stable/CHECKSUMS.TXT"
