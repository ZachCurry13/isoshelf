[entry.source]
# endoflife.date files LMDE under linuxmint with cycle names like "lmde7",
# which don't give the plain number the filenames use. The checksum file
# lists every LMDE ever released, so the highest one there is the newest.
type = "listing"
url = "https://mirrors.edge.kernel.org/linuxmint/debian/sha256sum.txt"
regex = 'lmde-(?P<version>\d+)-cinnamon-64bit\.iso'

[entry.artifact]
