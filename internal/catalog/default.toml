# The catalog built into isoshelf. The field reference is in CLAUDE.md
# ("Catalog") and internal/catalog/catalog.go. Where each source was found, and
# when it was last checked: docs/catalog-sources.md.
#
# Entries are grouped by what isoshelf can do with them:
#   1. download: update checks plus a place to download from
#   2. check-only: update checks, but no confirmed official checksums yet
#   3. manual: recognized, with a download page link

schema = 1

# ---------------------------------------------------------------------------
# 1. Download
# ---------------------------------------------------------------------------

# --- Desktop Linux ---------------------------------------------------------

[[entry]]
id = "ubuntu-desktop-lts"
name = "Ubuntu Desktop LTS"
arch = "x86_64"
match = 'ubuntu-(?P<version>\d[02468]\.04(?:\.\d+)*)-desktop-amd64\.iso' # LTS = even year, .04
samples = ["ubuntu-20.04.3-desktop-amd64.iso", "ubuntu-22.04-desktop-amd64.iso", "ubuntu-22.04.3-desktop-amd64.iso", "ubuntu-26.04.1-desktop-amd64.iso"]
page = "https://ubuntu.com/download"

[entry.source]
type = "endoflife"
product = "ubuntu"
channel = "lts"

[entry.artifact]
base = "https://releases.ubuntu.com/{cycle}/"
file = 'ubuntu-{cycle}(?:\.\d+)*-desktop-amd64\.iso'
manifest = "SHA256SUMS"

