name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version to build and publish, written as vMAJOR.MINOR.PATCH. This makes a real release."
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Started by a tag push, the tag is the ref. Started by hand, it is
      # what was typed: GITHUB_REF_NAME is the branch then ("main"), so the
      # typed value has to win, or a hand-started run would build a version
      # called "main" and try to release it under that name.
      - name: work out the version
        id: version
        env:
          TYPED: ${{ inputs.tag }}
        run: |
          set -eu
          tag="${TYPED:-$GITHUB_REF_NAME}"
          case "$tag" in
            v[0-9]*) ;;
            *) echo "\"$tag\" is not a version like vMAJOR.MINOR.PATCH." >&2; exit 1 ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # One static binary per platform. No cgo, so nothing has to be installed
      # to run them.
      #
      # Each one is kept under two names on purpose. The copy in build/ keeps
      # the plain name, because that is what goes inside the portable folder:
      # it is the file people run from their drive, and the one a future
      # "update isoshelf" replaces in place, so it must not change every
      # release. The copy in dist/ carries the version, because that is what
      # people download and keep, and a Downloads folder full of
      # "isoshelf-windows-amd64 (3).exe" tells nobody which one is which.
      - name: build
        env:
          CGO_ENABLED: "0"
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -eu
          mkdir -p dist build
          build() {
            GOOS=$1 GOARCH=$2 go build -trimpath \
              -ldflags "-s -w -X main.version=$TAG" \
              -o "build/$3" ./cmd/isoshelf
            cp "build/$3" "dist/isoshelf-$TAG-${3#isoshelf-}"
          }
          build windows amd64 isoshelf-windows-amd64.exe
          build linux   amd64 isoshelf-linux-amd64
          build linux   arm64 isoshelf-linux-arm64
          ls -l dist build

      # The portable folder is copied onto a drive as it is: the marker file
      # next to the binaries is what turns portable mode on.
      - name: portable folder
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -eu
          mkdir -p portable/isoshelf
          cp build/isoshelf-windows-amd64.exe build/isoshelf-linux-amd64 build/isoshelf-linux-arm64 portable/isoshelf/
          cp README.md LICENSE portable/isoshelf/
          printf 'This file makes isoshelf portable: it keeps its settings, logs and\ntemporary files in this folder instead of on the computer.\n' \
            > portable/isoshelf/portable
          (cd portable && zip -r "../dist/isoshelf-$TAG-portable.zip" isoshelf)

      - name: checksums
        run: cd dist && sha256sum * > SHA256SUMS

      # isoshelf installs an update of itself only if SHA256SUMS carries this
      # project's signature (decision 14), and a release without one can't be
      # installed that way at all - so a missing or wrong key stops the
      # release here, with a message, rather than shipping one nobody can
      # update to. The private key is the RELEASE_SIGNING_KEY secret; the
      # public half is internal/appupdate/release.pub, and the tool checks
      # its own signature against it before writing SHA256SUMS.sig.
      - name: sign
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: go run ./internal/appupdate/sign dist/SHA256SUMS

      # The release notes are that version's section of CHANGELOG.md, written
      # for people rather than generated from commit titles.
      - name: release notes
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -eu
          awk -v tag="$TAG" '
            index($0, "## [" tag "]") == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on && /^\[v[0-9]/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "CHANGELOG.md has no section for $TAG; add one before tagging." >&2
            exit 1
          fi
          cat notes.md

      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -eu
          # Only a tag with a suffix - v1.0.0-rc1 - is a pre-release.
          #
          # Marking every v0.* as one was tried in v0.4.10 and taken straight
          # back out, because it broke updates for every isoshelf already
          # installed. Those ask GitHub for /releases/latest, which skips
          # pre-releases; with every new release marked, that call returned
          # the last unmarked one forever, so nobody was ever told a new
          # isoshelf existed. The fix for that shipped in the same release
          # somebody would first have to be told about - which they couldn't
          # be. Before 1.0 the newest release IS the release, and it has to
          # be findable by the thing every deployed copy asks.
          #
          # What being before 1.0 means is said in the README and in the
          # release notes, where it reaches people and breaks nothing.
          PRERELEASE="--prerelease=false"
          case "$TAG" in
            *-*) PRERELEASE="--prerelease=true" ;;
          esac

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file notes.md $PRERELEASE
          else
            gh release create "$TAG" --title "isoshelf $TAG" --notes-file notes.md $PRERELEASE
          fi
          gh release upload "$TAG" dist/* --clobber
