name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build, for a dry run"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: work out the version
        id: version
        run: echo "tag=${GITHUB_REF_NAME:-${{ inputs.tag }}}" >> "$GITHUB_OUTPUT"

      # One static binary per platform. No cgo, so nothing has to be installed
      # to run them.
      - name: build
        env:
          CGO_ENABLED: "0"
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -eu
          mkdir -p dist
          build() {
            GOOS=$1 GOARCH=$2 go build -trimpath \
              -ldflags "-s -w -X main.version=$TAG" \
              -o "dist/$3" ./cmd/isoshelf
          }
          build windows amd64 isoshelf-windows-amd64.exe
          build linux   amd64 isoshelf-linux-amd64
          build linux   arm64 isoshelf-linux-arm64

      # The portable folder is copied onto a drive as it is: the marker file
      # next to the binaries is what turns portable mode on.
      - name: portable folder
        run: |
          set -eu
          mkdir -p portable/isoshelf
          cp dist/isoshelf-windows-amd64.exe dist/isoshelf-linux-amd64 dist/isoshelf-linux-arm64 portable/isoshelf/
          cp README.md LICENSE portable/isoshelf/
          printf 'This file makes isoshelf portable: it keeps its settings, logs and\ntemporary files in this folder instead of on the computer.\n' \
            > portable/isoshelf/portable
          (cd portable && zip -r ../dist/isoshelf-portable.zip isoshelf)

      - name: checksums
        run: cd dist && sha256sum * > SHA256SUMS

      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -eu
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "isoshelf $TAG" --generate-notes
          fi
          gh release upload "$TAG" dist/* --clobber
