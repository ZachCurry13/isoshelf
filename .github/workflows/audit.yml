name: Weekly audit

# Known security holes and newer versions of what isoshelf is built from,
# in ONE open issue labeled "audit": opened when something turns up, rewritten
# each week, and closed when everything is clear. It changes nothing and
# releases nothing; it only reports, and needs no key beyond GitHub's own.
#
# Two scans, because they answer different questions:
# - the code, built with the newest Go patch, as the next release would be:
#   a hole here needs a change to isoshelf or to a library;
# - the newest released program, as people have it installed: a hole here
#   that the first scan doesn't have needs nothing but a new release.
#
# Dependabot (.github/dependabot.yml) proposes the library, Actions and
# container base updates as pull requests; this is the one place that says
# so in words. Runs Mondays 06:17 UTC, or Actions > Weekly audit > Run
# workflow (untick "Open or update the issue" for a dry run).

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
    inputs:
      report:
        description: "Open or update the issue (untick for a dry run)"
        type: boolean
        default: true

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: the code
        id: code
        run: |
          set +e
          go run golang.org/x/vuln/cmd/govulncheck@latest ./... > code.txt 2>&1
          echo "status=$?" >> "$GITHUB_OUTPUT"
          tail -n 40 code.txt

      - name: the newest release, as installed
        id: released
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          tag=$(gh release view --json tagName -q .tagName)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          gh release download "$tag" --pattern '*-linux-amd64' --output isoshelf-released
          go run golang.org/x/vuln/cmd/govulncheck@latest -mode=binary isoshelf-released > released.txt 2>&1
          echo "status=$?" >> "$GITHUB_OUTPUT"
          tail -n 40 released.txt

      - name: newer versions of what isoshelf uses
        run: |
          go list -m -u -f '{{if and (not .Indirect) .Update}}{{.Path}} {{.Version}} -> {{.Update.Version}}{{end}}' all > updates.txt
          cat updates.txt

      - name: report
        env:
          GH_TOKEN: ${{ github.token }}
          CODE: ${{ steps.code.outputs.status }}
          RELEASED: ${{ steps.released.outputs.status }}
          TAG: ${{ steps.released.outputs.tag }}
          REPORT: ${{ github.event_name == 'schedule' || inputs.report }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          summary() { grep -E '^(Vulnerability #|    Found in|    Fixed in|Your code|No vulnerabilities)' "$1" | head -n 60; }
          {
            echo "## Weekly audit $(date -u +%F)"
            echo
            if [ "$RELEASED" != "0" ]; then
              echo "### The released program, $TAG, has known holes"
              echo '```'; summary released.txt; echo '```'
              if [ "$CODE" = "0" ]; then
                echo "The code doesn't have them when built today, so **a new release is the whole fix**: it is built with the newest Go patch by itself."
              fi
              echo
            fi
            if [ "$CODE" != "0" ]; then
              echo "### The code has known holes, even built with the newest Go"
              echo '```'; summary code.txt; echo '```'
              echo "Run \`go run golang.org/x/vuln/cmd/govulncheck@latest ./...\` for where isoshelf reaches each one. This needs a change: a library update, or code that stops calling the broken part."
              echo
            fi
            if [ -s updates.txt ]; then
              echo "### Newer versions of what isoshelf uses"
              echo '```'; cat updates.txt; echo '```'
              echo "Dependabot opens a pull request for each. A patch or minor release that fixes a hole above is safe to take; anything else is read first."
              echo
            fi
            echo "[This run]($RUN_URL)"
          } > body.md
          cat body.md >> "$GITHUB_STEP_SUMMARY"

          clear=true
          if [ "$CODE" != "0" ] || [ "$RELEASED" != "0" ] || [ -s updates.txt ]; then clear=false; fi
          [ "$REPORT" = "true" ] || { echo "Dry run: no issue changed."; exit 0; }

          gh label create audit --color 5319e7 --description "Weekly audit report" 2>/dev/null || true
          number=$(gh issue list --state open --label audit --json number --jq '.[0].number // empty')
          if [ "$clear" = "true" ]; then
            if [ -n "$number" ]; then
              gh issue comment "$number" --body "All clear on $(date -u +%F): no known holes in the code or in $TAG, and nothing newer to use."
              gh issue close "$number"
            fi
          elif [ -n "$number" ]; then
            gh issue edit "$number" --body-file body.md
          else
            gh issue create --title "Weekly audit" --label audit --body-file body.md
          fi
