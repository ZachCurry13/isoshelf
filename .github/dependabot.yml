# GitHub proposes updates as pull requests, one per change, and CI tests each
# one. Nothing is merged by itself: each is read and merged like any other
# pull request, and one that fails CI is simply closed.
#
# Go itself is left out: go.mod and the Dockerfile name only the 1.27 line,
# and every build takes its newest patch. The weekly audit (audit.yml) says
# when the released program needs a new release for one.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    ignore:
      - dependency-name: golang
